# v から始まるタグ（例: v0.1.0）を push すると、Windows 用のランチャーをビルドして Release に添付する。
name: Release launcher

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: タグと package.json のバージョンが一致するか確認
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::タグ $GITHUB_REF_NAME と package.json の version ($version) が一致しません"
            exit 1
          fi

      - run: npm ci --ignore-scripts

      - name: ビルド
        run: npm run launcher:build -- --bundles nsis

      - name: Release を作成してインストーラーを添付
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" launcher/src-tauri/target/release/bundle/nsis/*.exe \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
