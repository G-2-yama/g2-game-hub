# v から始まるタグ（例: v0.1.0）を push すると、Windows 用のランチャーをビルドして Release に添付する。
name: Release launcher

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      # 版はタグから決める（package.json の 0.0.0 は手元でのビルド用の仮の値）
      - name: タグから版を設定
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: ビルド
        run: npm run launcher:build -- --bundles nsis

      - name: Release を作成してインストーラーを添付
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" launcher/src-tauri/target/release/bundle/nsis/*.exe \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
