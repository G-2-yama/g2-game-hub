[package]
name = "g2-game-launcher"
version = "0.0.0"
edition = "2021"

[lib]
name = "g2_game_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-opener = "=2.7.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "=0.11.1"
keyring = "=4.2.0"
tokio = { version = "=1.54.1", features = ["sync"] }
